name: Keep Render backend warm

# Render's free tier spins the service down after ~15 minutes of
# inactivity, causing a 40-60s cold-start delay on the next real request
# (confirmed firsthand — see commit history around Sep 2026). This pings a
# lightweight, unauthenticated endpoint often enough to keep it awake.
# Every 5 minutes, not 10, to leave margin for GitHub's own documented
# scheduling delays on cron-triggered workflows.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        # No -f: a 401 (normal/expected — this endpoint requires a session)
        # still proves the server is up and should count as success. Only a
        # real connection failure/timeout should fail this step.
        # --max-time 90: generous enough to ride out a cold start if the
        # service did spin down between pings for any reason.
        run: curl -s --max-time 90 -o /dev/null -w "HTTP %{http_code}\n" https://rabdash-mobile-backend.onrender.com/Position
